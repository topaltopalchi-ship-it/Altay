plugins { id 'com.android.application' }

android {
    namespace 'ir.khone.yar'
    compileSdk 35
    defaultConfig {
        applicationId 'ir.khone.yar'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
