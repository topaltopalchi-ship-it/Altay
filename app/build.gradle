plugins { id 'com.android.application' }

def releaseKeystorePath = System.getenv("OBA_KEYSTORE_PATH")
def obaSupabaseUrl = (System.getenv("OBA_SUPABASE_URL") ?: project.findProperty("OBA_SUPABASE_URL") ?: "").toString()
def obaSupabasePublishableKey = (System.getenv("OBA_SUPABASE_PUBLISHABLE_KEY") ?: project.findProperty("OBA_SUPABASE_PUBLISHABLE_KEY") ?: "").toString()
def asBuildConfigString = { value -> '"' + value.replace('\\', '\\\\').replace('"', '\\"').replace('\n', '') + '"' }

android {
    namespace 'ir.khone.yar'
    compileSdk 35
    defaultConfig {
        applicationId 'ir.khone.yar'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        buildConfigField "String", "SUPABASE_URL", asBuildConfigString(obaSupabaseUrl)
        buildConfigField "String", "SUPABASE_PUBLISHABLE_KEY", asBuildConfigString(obaSupabasePublishableKey)
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (releaseKeystorePath != null && !releaseKeystorePath.isEmpty()) {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv("OBA_KEYSTORE_PASSWORD")
                keyAlias System.getenv("OBA_KEY_ALIAS")
                keyPassword System.getenv("OBA_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseKeystorePath != null && !releaseKeystorePath.isEmpty()) {
                signingConfig signingConfigs.release
            }
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'com.alphacephei:vosk-android:0.3.70'
    testImplementation 'junit:junit:4.13.2'
}
